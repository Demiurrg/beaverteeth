server:
  port: 8080

spring:
  application:
    name: export-service

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

export:
  directory: ./exports

doctor:
  service:
    url: http://doctor-service:8080

patient:
  service:
    url: http://patient-service:8080

appointment:
  service:
    url: http://appointment-service:8080

logging:
  level:
    com.beaverteeth.export: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method